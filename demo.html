<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ether Explains — Why the Moon has phases</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
/* BEAT PLAN — Glass and Light, 20 s
   1  0.0–4.5  Sun glow on the left; the Moon alone, half lit.   "The Moon makes no light of its own."
   2  4.5–9.5  Camera rises over the system; terminator ring.   "Sunlight always lights exactly half of it."
   3  9.5–15.5 Moon orbits Earth; inset shows the view from Earth. "As it circles us, we see more or less of that lit half."
   4 15.5–20   Pull back, phase strip forms; title.             "That changing view is what we call phases."   */
import * as THREE from 'three';

const DURATION = 20;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.ETHER_PIXEL_RATIO || Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// seeded random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const span = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- world ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040c);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);

// stars
{
  const n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 150 + rnd() * 60, s = Math.sqrt(1 - u * u);
    pos.set([r * s * Math.cos(th), r * u, r * s * Math.sin(th)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfc6ff, size: 0.45, sizeAttenuation: true, transparent: true, opacity: 0.75 })));
}

// sun (far left) — light + glow sprite
const SUN_DIR = new THREE.Vector3(-1, 0, 0);
const sunLight = new THREE.DirectionalLight(0xfff1d6, 3.2); sunLight.position.copy(SUN_DIR).multiplyScalar(50); scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x2a2450, 0.12));
function glowTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner); g.addColorStop(0.25, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgba(255,250,235,1)', 'rgba(255,190,90,0.45)'), blending: THREE.AdditiveBlending, depthWrite: false }));
sun.position.set(-60, 0, 0); sun.scale.setScalar(40); scene.add(sun);

// procedural surface textures
function surfTex(base, spots, n, sd) {
  seed = sd; const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 512, 256);
  for (let i = 0; i < n; i++) { x.fillStyle = spots[i % spots.length]; x.globalAlpha = 0.25 + rnd() * 0.5; x.beginPath(); x.arc(rnd() * 512, rnd() * 256, 4 + rnd() * 26, 0, 7); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// Earth: glassy ocean sphere with soft continents
const earth = new THREE.Mesh(new THREE.SphereGeometry(1.6, 64, 48),
  new THREE.MeshPhysicalMaterial({ map: surfTex('#1b4f8a', ['#3f8f6b', '#5aa37a', '#2e7a5c'], 70, 3), roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15 }));
scene.add(earth);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.75, 48, 32),
  new THREE.MeshBasicMaterial({ color: 0x6fc3ff, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, side: THREE.BackSide }));
earth.add(atmo);

// Moon orbit
const ORBIT_R = 7;
const orbitLine = new THREE.Mesh(new THREE.TorusGeometry(ORBIT_R, 0.015, 8, 200),
  new THREE.MeshBasicMaterial({ color: 0x8b6cff, transparent: true, opacity: 0 }));
orbitLine.rotation.x = Math.PI / 2; scene.add(orbitLine);
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.75, 64, 48),
  new THREE.MeshStandardMaterial({ map: surfTex('#b9b4aa', ['#8d877d', '#a39d92', '#77726a'], 160, 11), roughness: 0.95 }));
scene.add(moon);
// terminator ring: a glowing circle that always faces the sun, marking the lit half
const term = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.018, 8, 120),
  new THREE.MeshBasicMaterial({ color: 0xe8c37a, transparent: true, opacity: 0 }));
moon.add(term); term.rotation.y = Math.PI / 2; // ring plane perpendicular to sun direction (x axis)
// sun rays toward moon
const rays = new THREE.Group(); scene.add(rays);
for (let i = 0; i < 9; i++) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 6), new THREE.MeshBasicMaterial({ color: 0xffe2a8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
  m.rotation.z = Math.PI / 2; m.userData.y = (i - 4) * 0.17; rays.add(m);
}
// sight line from Earth to Moon
const sight = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 6), new THREE.MeshBasicMaterial({ color: 0x5fe3ff, transparent: true, opacity: 0 }));
scene.add(sight);

// phase strip (8 small moons) for the ending — each lit from a different angle relative to the viewer
const strip = new THREE.Group(); camera.add(strip); scene.add(camera);
const stripMoons = [];
const moonMap = moon.material.map;
for (let i = 0; i < 8; i++) {
  const phi = (i / 8) * Math.PI * 2;
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: moonMap }, uLight: { value: new THREE.Vector3(Math.sin(phi), 0.0, -Math.cos(phi)).normalize() } },
    vertexShader: 'varying vec3 vN; varying vec2 vUv; void main(){ vUv=uv; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform sampler2D map;\nuniform vec3 uLight;\nvarying vec3 vN;\nvarying vec2 vUv;\nvoid main(){\n  vec3 c = texture2D(map, vUv).rgb;\n  float d = smoothstep(-0.03, 0.12, dot(normalize(vN), uLight));\n  gl_FragColor = vec4(c * (0.035 + 1.15 * d), 1.0);\n  #include <colorspace_fragment>\n}'
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.42, 40, 30), mat);
  strip.add(m); stripMoons.push(m);
}

/* ---------- inset camera: view from Earth ---------- */
const insetCam = new THREE.PerspectiveCamera(14, 1, 0.1, 100);

/* ---------- HUD (all text drawn in-canvas) ---------- */
const hud = new THREE.Scene();
const hudCam = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
const hudCanvas = document.createElement('canvas');
const hctx = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas); hudTex.colorSpace = THREE.SRGBColorSpace;
const hudQuad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false }));
hudQuad.position.set(0.5, 0.5, 0); hud.add(hudQuad);
const CAPS = [
  [0.3, 4.5, 'The Moon makes no light of its own.'],
  [4.7, 9.5, 'Sunlight always lights exactly half of it.'],
  [9.7, 15.5, 'As it circles us, we see more or less of that lit half.'],
  [15.7, 20.5, 'That changing view is what we call phases.']
];
let hudKey = '';
function drawHud(t, inset) {
  const W = hudCanvas.width, H = hudCanvas.height, u = Math.min(W, H) / 1080;
  const cap = CAPS.find(c => t >= c[0] && t < c[1]);
  const a = cap ? Math.min(1, (t - cap[0]) / 0.45, (cap[1] - t) / 0.45) : 0;
  const titleA = span(t, 16.6, 17.6);
  const key = `${W}x${H}|${cap ? cap[2] : ''}|${a.toFixed(2)}|${titleA.toFixed(2)}|${inset ? inset.a.toFixed(2) : 0}`;
  if (key === hudKey) return; hudKey = key;
  hctx.clearRect(0, 0, W, H);
  if (cap && a > 0) {
    hctx.globalAlpha = a;
    const fs = Math.round(46 * u), padX = 34 * u;
    hctx.font = `500 ${fs}px Georgia, 'Times New Roman', serif`;
    const lines = wrap(cap[2], W * 0.8);
    const lh = fs * 1.3, bh = lines.length * lh + 28 * u, bw = Math.max(...lines.map(l => hctx.measureText(l).width)) + padX * 2;
    const by = H - H * 0.08 - bh, bx = (W - bw) / 2;
    hctx.fillStyle = 'rgba(8,6,20,0.55)'; round(bx, by, bw, bh, 18 * u); hctx.fill();
    hctx.strokeStyle = 'rgba(232,195,122,0.45)'; hctx.lineWidth = 1.5 * u; hctx.stroke();
    hctx.fillStyle = '#f3eeff'; hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    lines.forEach((l, i) => hctx.fillText(l, W / 2, by + 14 * u + lh * (i + 0.5)));
  }
  if (inset && inset.a > 0) {
    hctx.globalAlpha = inset.a;
    hctx.strokeStyle = 'rgba(95,227,255,0.8)'; hctx.lineWidth = 3 * u;
    hctx.beginPath(); hctx.arc(inset.cx, H - inset.cy, inset.r, 0, 7); hctx.stroke();
    hctx.font = `600 ${Math.round(22 * u)}px Inter, Helvetica, sans-serif`; hctx.fillStyle = '#9fefff'; hctx.textAlign = 'center';
    hctx.fillText('VIEW FROM EARTH', inset.cx, H - inset.cy + inset.r + 32 * u);
  }
  if (titleA > 0) {
    hctx.globalAlpha = titleA; hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.font = `italic 600 ${Math.round(64 * u)}px Georgia, serif`; hctx.fillStyle = '#e8c37a';
    hctx.fillText('Ether Explains', W / 2, H * 0.14);
    hctx.font = `500 ${Math.round(24 * u)}px Inter, Helvetica, sans-serif`; hctx.fillStyle = 'rgba(236,232,255,0.8)';
    hctx.fillText('NEW  ·  CRESCENT  ·  QUARTER  ·  GIBBOUS  ·  FULL', W / 2, H * 0.14 + 58 * u);
  }
  hctx.globalAlpha = 1; hudTex.needsUpdate = true;
}
function wrap(text, max) { const w = text.split(' '), out = []; let l = ''; for (const x of w) { const tt = l ? l + ' ' + x : x; if (hctx.measureText(tt).width > max && l) { out.push(l); l = x; } else l = tt; } out.push(l); return out; }
function round(x, y, w, h, r) { hctx.beginPath(); hctx.moveTo(x + r, y); hctx.arcTo(x + w, y, x + w, y + h, r); hctx.arcTo(x + w, y + h, x, y + h, r); hctx.arcTo(x, y + h, x, y, r); hctx.arcTo(x, y, x + w, y, r); hctx.closePath(); }

/* ---------- sound (subtle chimes on each beat) ---------- */
let audioContext = null, masterGain = null, muted = true;
function ensureAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioContext.createGain(); masterGain.gain.value = 0; masterGain.connect(audioContext.destination);
  api.audioContext = audioContext; api.masterGain = masterGain;
}
const CHIMES = [0.3, 4.7, 9.7, 15.7];
let lastT = -1;
function chime(f) {
  if (!audioContext || muted) return;
  const now = audioContext.currentTime;
  [1, 1.5, 2].forEach((m, i) => {
    const o = audioContext.createOscillator(), g = audioContext.createGain();
    o.type = 'sine'; o.frequency.value = f * m; g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.12 / (i + 1), now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
    o.connect(g); g.connect(masterGain); o.start(now); o.stop(now + 2.3);
  });
}

/* ---------- timeline ---------- */
function moonAngle(t) {
  // starts beside Earth on the far side from the sun-ish, then orbits during beat 3
  return Math.PI * 0.15 + span(t, 9.3, 15.6) * Math.PI * 2 * 0.85 + span(t, 15.6, 20) * Math.PI * 0.3;
}
const inset = { a: 0, cx: 0, cy: 0, r: 0 };
function update(t) {
  const W = renderer.domElement.width, H = renderer.domElement.height;
  // moon position
  const ang = moonAngle(t);
  moon.position.set(Math.cos(ang) * ORBIT_R, 0, Math.sin(ang) * ORBIT_R);
  moon.rotation.y = -ang + Math.PI; // tidally locked
  term.rotation.set(0, Math.PI / 2 + ang - Math.PI, 0); // counter the moon spin so the ring stays facing the sun
  earth.rotation.y = t * 0.25;

  // beat 1: close on the moon from Earth's side
  const p1 = new THREE.Vector3().copy(moon.position).add(new THREE.Vector3(2.2, 0.6, 3.6));
  const l1 = moon.position.clone();
  // beat 2: high three-quarter view of the whole system
  const p2 = new THREE.Vector3(9, 13, 15), l2 = new THREE.Vector3(0, 0, 0);
  // beat 4: pulled back and lower
  const p4 = new THREE.Vector3(0, 6.5, 20), l4 = new THREE.Vector3(0, -1.2, 0);
  const k2 = span(t, 4.6, 8.4), k4 = span(t, 15.6, 18.2);
  const pos = p1.clone().lerp(p2, k2).lerp(p4, k4), look = l1.clone().lerp(l2, k2).lerp(l4, k4);
  // gentle drift
  pos.x += Math.sin(t * 0.3) * 0.3; pos.y += Math.sin(t * 0.21) * 0.2;
  camera.position.copy(pos); camera.lookAt(look);

  // overlays
  term.material.opacity = 0.9 * span(t, 5.2, 6.5) * (1 - span(t, 15.6, 16.5));
  orbitLine.material.opacity = 0.55 * span(t, 6.5, 8.5);
  const raysA = span(t, 0.8, 2.2) * (1 - span(t, 9.0, 10.0));
  rays.children.forEach((m, i) => {
    const from = new THREE.Vector3(-18, m.userData.y, 0).add(new THREE.Vector3(0, 0, moon.position.z * 0.0));
    const to = moon.position.clone().add(new THREE.Vector3(0, m.userData.y * 0.9, 0));
    from.z = to.z; const len = from.distanceTo(to) - 0.75;
    m.scale.set(1, len, 1); m.position.copy(from).lerp(to, 0.5 - 0.75 / (2 * len));
    m.material.opacity = raysA * (0.35 + 0.3 * Math.sin(t * 3 + i));
  });
  const sightA = span(t, 9.8, 10.8) * (1 - span(t, 15.4, 16.2));
  { const a = earth.position, b = moon.position, len = a.distanceTo(b);
    sight.scale.set(1, len - 2.4, 1); sight.position.copy(a).lerp(b, 0.5);
    sight.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    sight.material.opacity = 0.7 * sightA; }

  // phase strip rises into view under the system (placed in camera space so it stays level)
  const ks = span(t, 16.2, 18.4);
  strip.visible = ks > 0;
  stripMoons.forEach((m, i) => {
    const k = ease(ks * 1.25 - i * 0.03);
    m.position.set((i - 3.5) * 1.05, lerp(-4.2, -1.05, k), -9);
    m.scale.setScalar(Math.max(0.001, k));
  });

  // inset view from Earth: camera on Earth surface looking at the moon
  inset.a = span(t, 10.0, 11.0) * (1 - span(t, 15.3, 16.0));
  inset.r = Math.min(W, H) * 0.14; inset.cx = W - inset.r - Math.min(W, H) * 0.07; inset.cy = H - inset.r - Math.min(W, H) * 0.07;
  insetCam.position.copy(earth.position).add(moon.position.clone().normalize().multiplyScalar(1.9));
  insetCam.lookAt(moon.position);

  drawHud(t, inset);

  // chimes
  if (lastT >= 0) CHIMES.forEach((c, i) => { if (lastT < c && t >= c) chime([392, 440, 494, 523][i]); });
  lastT = t;
}

/* ---------- render ---------- */
function render(t) {
  update(t);
  const W = renderer.domElement.width, H = renderer.domElement.height;
  renderer.setViewport(0, 0, W / renderer.getPixelRatio(), H / renderer.getPixelRatio());
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.render(scene, camera);
  if (inset.a > 0.01) {
    const pr = renderer.getPixelRatio(), r = inset.r / pr, cx = inset.cx / pr, cy = inset.cy / pr;
    renderer.setScissorTest(true);
    renderer.setScissor(cx - r, cy - r, r * 2, r * 2); renderer.setViewport(cx - r, cy - r, r * 2, r * 2);
    insetCam.aspect = 1; insetCam.updateProjectionMatrix();
    const bg = scene.background; scene.background = new THREE.Color(0x020208);
    strip.visible = false; orbitLine.visible = false; sight.visible = false; rays.visible = false; term.visible = false;
    renderer.clear(); renderer.render(scene, insetCam);
    orbitLine.visible = sight.visible = rays.visible = term.visible = true;
    scene.background = bg;
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W / pr, H / pr);
  }
  renderer.clearDepth();
  renderer.render(hud, hudCam);
}

/* ---------- clock + API ---------- */
let time = 0, playing = false, lastNow = 0, ended = false;
const api = {
  duration: DURATION,
  get time() { return time; },
  get playing() { return playing; },
  play() { if (time >= DURATION) time = 0; playing = true; ended = false; lastNow = performance.now(); },
  pause() { playing = false; },
  seek(t) { time = Math.max(0, Math.min(DURATION, t)); lastT = -1; ended = time >= DURATION; render(time); },
  restart() { this.seek(0); this.play(); },
  setMuted(m) {
    muted = !!m; ensureAudio();
    if (!muted) audioContext.resume();
    masterGain.gain.setTargetAtTime(muted ? 0 : 0.8, audioContext.currentTime, 0.05);
  },
  audioContext: null, masterGain: null
};
window.ether = api;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const W = renderer.domElement.width, H = renderer.domElement.height;
  hudCanvas.width = W; hudCanvas.height = H; hudKey = '';
  camera.fov = innerWidth < innerHeight ? 58 : 38; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function loop(now) {
  if (playing) {
    time += Math.min(0.1, (now - lastNow) / 1000);
    if (time >= DURATION) { time = DURATION; playing = false; if (!ended) { ended = true; parent.postMessage({ type: 'ether-end' }, '*'); } }
  }
  lastNow = now;
  render(time);
  requestAnimationFrame(loop);
}
render(0);
api.play();
parent.postMessage({ type: 'ether-ready', duration: DURATION }, '*');
requestAnimationFrame(loop);
</script>
</body>
</html>
