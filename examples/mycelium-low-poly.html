<script type="module">
/* BEAT PLAN — Low-Poly, 9:16, 20 s, no narration
   1  0.0– 4.2  A faceted floating island at golden hour; a coral mushroom pops up.    "That mushroom is just the fruit of a fungus."
   2  4.2– 8.2  The front of the island slides away like a cut cake, revealing a pale
                web under the soil; camera settles face-on to the cross-section.         "The fungus itself lives underground: mycelium."
   3  8.2–12.2  The web spreads outward, branching tip by tip across the soil.         "It's a web of hyphae — threads thinner than a hair."
   4 12.2–16.2  A thread reaches up under fallen leaves; the leaves crumble into facets,
                and glowing nutrient specks flow back through the web.                   "Hyphae break down dead leaves into nutrients."
   5 16.2–20.0  Threads join the tree roots; gold sugar and teal minerals trade along
                them. Title settles at the top: MYCELIUM.                                "Many join tree roots, trading minerals for sugar." */
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const DURATION = 20;

/* ---------- helpers ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const span = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const at = (curve, u) => curve.getPointAt(clamp(u, 0.0005, 0.9995));
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const C = {
  sand: '#e9c89b', coral: '#e27d60', cream: '#f6ead6', teal: '#2a9d8f', sage: '#8ab17d', sageDark: '#6f9a6a',
  soil: '#b8664c', soilDeep: '#9a5444', rock: '#d9c2a0', bark: '#8a5a44', thread: '#fff4e2', gold: '#f2b84b'
};

// faceted mesh: merge → optional jitter → flat faces with per-face tone shifts
function facet(geo, color, { jitter = 0, seed = 1, vary = 0.06, jitterFn = null } = {}) {
  const r = rng(seed);
  let g = geo.clone();
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(p, i);
    if (jitterFn) jitterFn(v, r);
    else if (jitter) v.add(new THREE.Vector3((r() - .5) * jitter, (r() - .5) * jitter, (r() - .5) * jitter));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g = g.toNonIndexed(); g.computeVertexNormals();
  const base = new THREE.Color(color), hsl = {}; base.getHSL(hsl);
  const cols = new Float32Array(g.attributes.position.count * 3);
  for (let f = 0; f < cols.length / 9; f++) {
    const c = new THREE.Color().setHSL(hsl.h + (r() - .5) * 0.015, clamp(hsl.s + (r() - .5) * vary), clamp(hsl.l + (r() - .5) * vary));
    for (let k = 0; k < 3; k++) cols.set([c.r, c.g, c.b], f * 9 + k * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, metalness: 0 }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.ETHER_PIXEL_RATIO || Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// warm golden-hour sky as a faceted gradient backdrop
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#f3cfa8'); g.addColorStop(0.55, '#f6e3c8'); g.addColorStop(1, '#e9b79a');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.fog = new THREE.Fog('#f2d9bd', 26, 48);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.HemisphereLight('#fff1dc', '#b0806a', 1.35));
const sun = new THREE.DirectionalLight('#ffd9a8', 2.6);
sun.position.set(-9, 6.5, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ---------- island: back half stays, front half slides away ---------- */
const W = 6, D = 3;                       // island width, depth of each half
const LAYERS = [                          // [top, bottom, colour]
  [0.0, -0.32, C.sage], [-0.32, -1.25, C.soil], [-1.25, -2.25, C.soilDeep], [-2.25, -2.9, C.rock]
];
function islandHalf(sign, seed) {
  const g = new THREE.Group();
  LAYERS.forEach(([top, bot, col], i) => {
    const h = top - bot;
    const box = new THREE.BoxGeometry(W, h, D, 7, 1, 4);
    box.translate(0, (top + bot) / 2, sign * D / 2);
    const m = facet(box, col, {
      seed: seed + i * 13, vary: i === 0 ? 0.08 : 0.05,
      jitterFn: (v, r) => {
        if (i === 0 && v.y > -0.01) v.y += (r() - 0.35) * 0.16;           // bumpy grass top
        const edge = Math.abs(v.x) > W / 2 - 0.01 || Math.abs(v.z) > D * 2 - 0.01 || (sign > 0 ? v.z > D - 0.01 : v.z < -D + 0.01);
        if (edge && i > 0) { v.x += (r() - .5) * 0.12; }                    // rough outer walls (cut face stays flat)
      }
    });
    g.add(m);
  });
  // tapered faceted underside (cut face at z=0 stays planar)
  const under = new THREE.BoxGeometry(W, 2.2, D, 5, 2, 3);
  under.translate(0, -2.9 - 1.1, sign * D / 2);
  const um = facet(under, C.rock, {
    seed: seed + 99, vary: 0.07,
    jitterFn: (v, r) => { const k = clamp((-2.9 - v.y) / 2.2); v.x *= lerp(1, 0.25, k); v.z *= lerp(1, 0.3, k); v.y -= k * r() * 0.5; }
  });
  g.add(um);
  return g;
}
const island = new THREE.Group(); scene.add(island);
const back = islandHalf(-1, 10); island.add(back);
const front = islandHalf(1, 40); island.add(front);

// pond on the back half
const pond = facet(new THREE.CylinderGeometry(0.75, 0.75, 0.08, 7), C.teal, { seed: 5, vary: 0.05 });
pond.position.set(1.85, 0.02, -2.05); pond.receiveShadow = true; back.add(pond);

// trees (low cones on stubby trunks)
function tree(x, z, s, seed) {
  const g = new THREE.Group();
  const trunk = facet(new THREE.CylinderGeometry(0.11, 0.16, 0.9, 5), C.bark, { seed, vary: 0.05 });
  trunk.position.y = 0.45; g.add(trunk);
  [[1.0, 1.15, 0.95], [0.78, 1.0, 1.55], [0.52, 0.85, 2.05]].forEach(([r, h, y], i) => {
    const cone = facet(new THREE.ConeGeometry(r, h, 6), i % 2 ? C.sageDark : C.sage, { seed: seed + i, jitter: 0.08, vary: 0.07 });
    cone.position.y = y; g.add(cone);
  });
  g.position.set(x, 0, z); g.scale.setScalar(s); return g;
}
const treeL = tree(-2.1, -0.75, 1.05, 21); back.add(treeL);
const treeR = tree(2.3, -0.8, 0.9, 31); back.add(treeR);
back.add(tree(-0.9, -2.3, 0.7, 41));
// rocks and tufts
[[0.6, -2.4, 0.22], [-2.5, -2.3, 0.18], [2.6, 0.9, 0.2], [-1.6, 1.4, 0.16], [0.9, 2.1, 0.2]].forEach(([x, z, s], i) => {
  const r = facet(new THREE.DodecahedronGeometry(s, 0), i % 2 ? C.cream : C.sand, { seed: 70 + i, jitter: s * 0.4 });
  r.position.set(x, s * 0.4, z); (z > 0 ? front : back).add(r);
});

// mushroom (fruiting body) sitting just behind the cut
const mush = new THREE.Group();
{
  const stem = facet(new THREE.CylinderGeometry(0.15, 0.22, 0.75, 6), C.cream, { seed: 3, vary: 0.04 });
  stem.position.y = 0.37; mush.add(stem);
  const cap = facet(new THREE.SphereGeometry(0.58, 7, 4, 0, Math.PI * 2, 0, Math.PI / 2), C.coral, { seed: 4, jitter: 0.06, vary: 0.07 });
  cap.scale.y = 0.75; cap.position.y = 0.68; mush.add(cap);
  const spotR = rng(9);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + spotR() * 0.4, el = 0.35 + spotR() * 0.5;
    const s = facet(new THREE.IcosahedronGeometry(0.06, 0), C.cream, { seed: 50 + i });
    s.position.set(Math.cos(a) * 0.58 * Math.cos(el), 0.68 + Math.sin(el) * 0.58 * 0.75, Math.sin(a) * 0.58 * Math.cos(el));
    mush.add(s);
  }
  const small = mush.clone(); small.scale.setScalar(0.5); small.position.set(0.55, 0, 0.15); small.rotation.y = 1; mush.add(small);
}
mush.position.set(-0.25, 0, -0.45); back.add(mush);
const MUSH_BASE = new THREE.Vector3(-0.25, -0.33, 0.04);

// fallen leaves (on the back half, just behind the cut)
const leaves = new THREE.Group(); back.add(leaves);
{
  const lr = rng(17);
  for (let i = 0; i < 6; i++) {
    const g = new THREE.OctahedronGeometry(0.42, 0); g.scale(1.3, 0.12, 0.7);
    const l = facet(g, [C.coral, C.sand, '#d9925a'][i % 3], { seed: 80 + i, vary: 0.08 });
    l.position.set(1.05 + (lr() - .5) * 0.9, 0.09 + i * 0.03, -0.35 + (lr() - .5) * 0.4);
    l.rotation.set((lr() - .5) * 0.4, lr() * 6, (lr() - .5) * 0.3);
    l.userData.home = l.position.clone(); l.userData.rot = l.rotation.clone();
    leaves.add(l);
  }
  const twig = facet(new THREE.CylinderGeometry(0.04, 0.05, 1.0, 4), C.bark, { seed: 88 });
  twig.rotation.z = Math.PI / 2; twig.rotation.y = 0.5; twig.position.set(1.2, 0.08, -0.6);
  twig.userData.home = twig.position.clone(); twig.userData.rot = twig.rotation.clone();
  leaves.add(twig);
}
const LEAF_BASE = new THREE.Vector3(1.15, -0.34, 0.04);
// crumbs that fall from the leaves into the soil
const crumbs = [];
{
  const cr = rng(23);
  for (let i = 0; i < 14; i++) {
    const m = facet(new THREE.TetrahedronGeometry(0.06 + cr() * 0.05, 0), [C.coral, C.sand, '#d9925a'][i % 3], { seed: 200 + i });
    m.userData = { x: 0.8 + cr() * 0.75, z: -0.35 + cr() * 0.3, delay: cr() * 1.3, spin: cr() * 6 };
    m.visible = false; back.add(m); crumbs.push(m);
  }
}

/* ---------- roots (drawn in the cut face) ---------- */
const Z = 0.045; // plane just in front of the back half's cut face
function tube(points, radius, color, seed, radial = 4) {
  const curve = new THREE.CatmullRomCurve3(points);
  const segs = Math.max(4, points.length * 4);
  const g = new THREE.TubeGeometry(curve, segs, radius, radial, false);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, emissive: color, emissiveIntensity: 0.0 }));
  m.userData.curve = curve; m.userData.total = g.index.count;
  return m;
}
const rootTips = [];
function rootSystem(x0, seed) {
  const r = rng(seed); const g = new THREE.Group();
  const main = [new THREE.Vector3(x0, -0.3, Z)];
  for (let i = 1; i <= 5; i++) main.push(new THREE.Vector3(x0 + (r() - .5) * 0.25, -0.3 - i * 0.28, Z));
  g.add(tube(main, 0.06, C.bark, seed));
  rootTips.push(main[main.length - 1]);
  for (let b = 0; b < 4; b++) {
    const start = main[1 + b].clone(), dir = (b % 2 ? 1 : -1);
    const pts = [start];
    for (let i = 1; i <= 4; i++) pts.push(new THREE.Vector3(start.x + dir * i * 0.22 + (r() - .5) * 0.06, start.y - i * 0.13 - r() * 0.05, Z));
    g.add(tube(pts, 0.032 - b * 0.004, C.bark, seed + b));
    rootTips.push(pts[pts.length - 1]);
  }
  return g;
}
const rootsL = rootSystem(-2.1, 61); back.add(rootsL);
const rootsR = rootSystem(2.3, 62); back.add(rootsR);

/* ---------- mycelium (hyphae as thin faceted threads that grow) ---------- */
const XMIN = -2.8, XMAX = 2.8, YTOP = -0.42, YBOT = -2.15;
const hyphae = [];   // { mesh, d0, d1, group: 'net'|'leaf'|'roots', curve }
const threadMat = new THREE.MeshStandardMaterial({ color: C.thread, emissive: '#fff1d8', emissiveIntensity: 0.35, flatShading: true, roughness: 0.6 });
function addHypha(points, d0, group, radius) {
  const curve = new THREE.CatmullRomCurve3(points);
  const len = curve.getLength();
  const g = new THREE.TubeGeometry(curve, Math.max(6, Math.round(len * 14)), radius, 3, false);
  const m = new THREE.Mesh(g, threadMat);
  back.add(m);
  const h = { mesh: m, d0, d1: d0 + len, group, curve, total: g.index.count };
  hyphae.push(h); return h;
}
// random branching walk outward from the mushroom base
{
  const r = rng(7);
  function walk(start, angle, d0, depth, steps) {
    const pts = [start.clone()]; let p = start.clone(), a = angle, d = d0;
    for (let i = 0; i < steps; i++) {
      a += (r() - .5) * 0.9;
      const step = 0.16 + r() * 0.08;
      let nx = p.x + Math.cos(a) * step, ny = p.y + Math.sin(a) * step;
      if (ny > YTOP) { ny = YTOP; a = -Math.abs(a) * 0.6 - 0.3; }
      if (ny < YBOT) { ny = YBOT; a = Math.abs(a) * 0.6 + 0.3; }
      if (nx < XMIN || nx > XMAX) break;
      p = new THREE.Vector3(nx, ny, Z); pts.push(p); d += step;
      if (depth < 3 && i > 2 && r() < 0.2) walk(p, a + (r() < .5 ? 1 : -1) * (0.5 + r() * 0.7), d, depth + 1, Math.floor(steps * 0.7));
    }
    if (pts.length > 2) addHypha(pts, d0, 'net', Math.max(0.016, 0.03 - depth * 0.005));
  }
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + (k - 2) * 0.62 + (r() - .5) * 0.2;
    walk(MUSH_BASE, a, 0, 0, 16 + Math.floor(r() * 8));
  }
  // stem threads into the mushroom base
  for (let k = 0; k < 3; k++) addHypha([MUSH_BASE.clone().setY(-0.02), MUSH_BASE.clone().add(new THREE.Vector3((k - 1) * 0.12, -0.25, 0))], 0, 'net', 0.018);
}
// guided threads: towards a target, with wobble
function guided(from, to, seed, group, d0) {
  const r = rng(seed); const pts = [from.clone()]; const n = Math.max(4, Math.round(from.distanceTo(to) / 0.2));
  for (let i = 1; i < n; i++) { const k = i / n; pts.push(new THREE.Vector3(lerp(from.x, to.x, k) + (r() - .5) * 0.16, lerp(from.y, to.y, k) + (r() - .5) * 0.16, Z)); }
  pts.push(to.clone()); return addHypha(pts, d0, group, 0.018);
}
const leafThreads = [
  guided(new THREE.Vector3(0.35, -0.95, Z), LEAF_BASE, 301, 'leaf', 0),
  guided(new THREE.Vector3(0.8, -1.35, Z), LEAF_BASE.clone().add(new THREE.Vector3(0.25, 0, 0)), 302, 'leaf', 0)
];
const rootThreads = [];
[[new THREE.Vector3(-1.2, -1.15, Z), 1], [new THREE.Vector3(-1.0, -1.7, Z), 3], [new THREE.Vector3(1.4, -1.3, Z), 6], [new THREE.Vector3(1.6, -1.85, Z), 8]]
  .forEach(([from, tipIdx], i) => rootThreads.push(guided(from, rootTips[tipIdx], 400 + i, 'roots', 0)));
const maxNetD = Math.max(...hyphae.filter(h => h.group === 'net').map(h => h.d1));

// glowing specks that travel along threads
function speckSet(n, color, size) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 }));
    back.add(m); arr.push(m);
  }
  return arr;
}
const nutrientSpecks = speckSet(12, '#ffcf7a', 0.085);
const sugarSpecks = speckSet(12, '#ffbe3d', 0.09);
const mineralSpecks = speckSet(12, '#34c6b3', 0.085);

/* ---------- HUD (all text drawn inside the canvas) ---------- */
const HUD_SCALE = 0.75;
const hud = new THREE.Scene();
const hudCam = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
const hc = document.createElement('canvas'); const hx = hc.getContext('2d');
const hudTex = new THREE.CanvasTexture(hc); hudTex.colorSpace = THREE.SRGBColorSpace;
hudTex.minFilter = THREE.LinearFilter; hudTex.generateMipmaps = false;
const hudQuad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false, depthWrite: false }));
hudQuad.position.set(0.5, 0.5, 0); hud.add(hudQuad);

const CAPS = [
  [0.4, 4.2, 'That mushroom is just the fruit of a fungus.'],
  [4.4, 8.2, 'The fungus itself lives underground: mycelium.'],
  [8.4, 12.2, 'It’s a web of hyphae — threads thinner than a hair.'],
  [12.4, 16.2, 'Hyphae break down dead leaves into nutrients.'],
  [16.4, 99, 'Many join tree roots, trading minerals for sugar.']
];
const LABELS = [ // [start, end, text, () => world point]
  [1.6, 4.0, 'fruiting body', () => mush.localToWorld(new THREE.Vector3(0.45, 0.95, 0))],
  [6.2, 8.2, 'mycelium', () => back.localToWorld(new THREE.Vector3(-1.3, -1.6, Z))],
  [9.6, 12.2, 'hypha', () => back.localToWorld(hyphaeTip())],
  [12.8, 15.6, 'dead leaves', () => back.localToWorld(new THREE.Vector3(1.05, 0.2, -0.35))],
  [16.8, 20.5, 'tree roots', () => back.localToWorld(new THREE.Vector3(-2.1, -0.95, Z))]
];
let tipCache = null;
function hyphaeTip() {
  if (tipCache) return tipCache;
  // a thread end out to the right, mid-depth — reads clearly as a single thread
  let best = null, score = -1e9;
  hyphae.filter(h => h.group === 'net').forEach(h => { const e = at(h.curve, 1); const s = e.x - Math.abs(e.y + 1.5) * 2; if (s > score) { score = s; best = e; } });
  return (tipCache = best.clone());
}
function polyCard(cx, cy, w, h, seed) {
  const r = rng(seed), pts = [];
  const n = 8;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + Math.PI / n;
    pts.push([cx + Math.cos(a) * w / 2 * (1.08 + (r() - .5) * 0.06), cy + Math.sin(a) * h / 2 * (1.25 + (r() - .5) * 0.1)]);
  }
  return pts;
}
function fillPoly(pts) { hx.beginPath(); pts.forEach(([x, y], i) => i ? hx.lineTo(x, y) : hx.moveTo(x, y)); hx.closePath(); hx.fill(); }
function wrap(text, max) { const w = text.split(' '), out = []; let l = ''; for (const x of w) { const tt = l ? l + ' ' + x : x; if (hx.measureText(tt).width > max && l) { out.push(l); l = x; } else l = tt; } out.push(l); return out; }
const v3 = new THREE.Vector3();
function drawHud(t) {
  const Wc = hc.width, Hc = hc.height, u = Math.min(Wc, Hc) / 1080;
  hx.clearRect(0, 0, Wc, Hc);
  // caption card: faceted cream tile with a coral drop facet
  const capIdx = CAPS.findIndex(c => t >= c[0] && t < c[1]);
  if (capIdx >= 0) {
    const [a0, a1, text] = CAPS[capIdx];
    const a = Math.min(1, (t - a0) / 0.45, capIdx === CAPS.length - 1 ? 1 : (a1 - t) / 0.45);
    const lift = (1 - ease(Math.min(1, (t - a0) / 0.5))) * 30 * u;
    hx.globalAlpha = clamp(a);
    const fs = Math.round(52 * u);
    hx.font = `600 ${fs}px Georgia, 'Times New Roman', serif`;
    const lines = wrap(text, Wc * 0.74), lh = fs * 1.28;
    const bw = Math.min(Wc * 0.88, Math.max(...lines.map(l => hx.measureText(l).width)) + 90 * u), bh = lines.length * lh + 40 * u;
    const cx = Wc / 2, cy = Hc * 0.835 + lift;
    const card = polyCard(cx, cy, bw, bh, 11 + capIdx);
    hx.fillStyle = 'rgba(160,80,60,0.35)'; fillPoly(card.map(([x, y]) => [x + 10 * u, y + 14 * u]));
    // facet fan
    for (let i = 0; i < card.length; i++) {
      const p = card[i], q = card[(i + 1) % card.length];
      const shade = 236 + ((i * 37) % 5) * 3 - (i > 3 ? 8 : 0);
      hx.fillStyle = `rgb(${shade + 10},${shade - 4},${shade - 22})`;
      hx.beginPath(); hx.moveTo(cx, cy); hx.lineTo(p[0], p[1]); hx.lineTo(q[0], q[1]); hx.closePath(); hx.fill();
    }
    hx.fillStyle = '#5b3a2e'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    lines.forEach((l, i) => hx.fillText(l, cx, cy - (lines.length - 1) * lh / 2 + i * lh));
  }
  // 3D-anchored labels with leader lines
  for (const [s, e, text, fn] of LABELS) {
    if (t < s || t > e) continue;
    const a = clamp(Math.min((t - s) / 0.4, (e - t) / 0.4));
    v3.copy(fn()).project(camera);
    const x = (v3.x * 0.5 + 0.5) * Wc, y = (-v3.y * 0.5 + 0.5) * Hc;
    const dx = x < Wc / 2 ? 1 : -1, lx = x + dx * 70 * u, ly = y - 70 * u;
    hx.globalAlpha = a;
    hx.strokeStyle = '#5b3a2e'; hx.lineWidth = 3 * u;
    hx.beginPath(); hx.moveTo(x, y); hx.lineTo(lx, ly); hx.lineTo(lx + dx * 24 * u, ly); hx.stroke();
    hx.fillStyle = '#5b3a2e'; hx.beginPath(); hx.arc(x, y, 6 * u, 0, 7); hx.fill();
    const fs = Math.round(34 * u); hx.font = `italic 600 ${fs}px Georgia, serif`;
    const tw = hx.measureText(text).width;
    const bx = dx > 0 ? lx + 30 * u : lx - 30 * u - tw - 28 * u, by = ly - fs * 0.8;
    hx.fillStyle = 'rgba(246,234,214,0.95)';
    fillPoly([[bx, by + 4 * u], [bx + tw + 28 * u, by], [bx + tw + 24 * u, by + fs * 1.6], [bx + 4 * u, by + fs * 1.62]]);
    hx.fillStyle = '#5b3a2e'; hx.textAlign = 'left'; hx.textBaseline = 'middle';
    hx.fillText(text, bx + 14 * u, by + fs * 0.8);
  }
  // title
  const ta = span(t, 17.2, 18.4);
  if (ta > 0) {
    hx.globalAlpha = ta; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    const fs = Math.round(112 * u), ty = Hc * 0.1 + (1 - ta) * 24 * u;
    hx.font = `700 ${fs}px Georgia, serif`;
    if ('letterSpacing' in hx) hx.letterSpacing = `${Math.round(10 * u)}px`;
    hx.fillStyle = 'rgba(184,102,76,0.55)'; hx.fillText('MYCELIUM', Wc / 2 + 6 * u, ty + 8 * u);
    hx.fillStyle = '#fff6e6'; hx.fillText('MYCELIUM', Wc / 2, ty);
    if ('letterSpacing' in hx) hx.letterSpacing = '0px';
    hx.font = `italic 500 ${Math.round(40 * u)}px Georgia, serif`; hx.fillStyle = '#7a4a38';
    hx.fillText('the hidden half of a fungus', Wc / 2, ty + fs * 0.78);
  }
  hx.globalAlpha = 1; hudTex.needsUpdate = true;
}

/* ---------- timeline ---------- */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frontAmount(t) { return span(t, 4.4, 6.6); }
function update(t) {
  // beat 1: mushroom pops up
  const pop = backOut((t - 0.5) / 1.1);
  mush.scale.set(Math.max(0.001, pop), Math.max(0.001, pop), Math.max(0.001, pop));
  mush.rotation.y = 0.3 + Math.sin(t * 0.6) * 0.04;

  // beat 2: front half slides forward and drops away
  const k = frontAmount(t);
  front.position.set(0, -k * k * 9, k * 5.5);
  front.rotation.x = k * 0.35;
  front.visible = k < 0.999;

  // mycelium growth: core web (beat 2) then outward spread (beat 3)
  const R = t < 8.4 ? lerp(0, 1.4, span(t, 5.4, 8.0)) : lerp(1.4, maxNetD + 0.1, span(t, 8.4, 11.8));
  const leafR = lerp(0, 3, span(t, 12.4, 13.6));
  const rootR = lerp(0, 3, span(t, 16.4, 17.6));
  for (const h of hyphae) {
    let frac;
    if (h.group === 'net') frac = clamp((R - h.d0) / (h.d1 - h.d0));
    else if (h.group === 'leaf') frac = clamp(leafR / (h.d1 - h.d0));
    else frac = clamp(rootR / (h.d1 - h.d0));
    const n = Math.floor(h.total * frac / 6) * 6;
    h.mesh.geometry.setDrawRange(0, n); h.mesh.visible = n > 0;
  }
  threadMat.emissiveIntensity = 0.35 + 0.25 * Math.sin(t * 2.2) * span(t, 8.4, 9.5);

  // beat 4: leaves crumble and sink, crumbs fall into the soil
  const crumble = span(t, 13.2, 15.4);
  leaves.children.forEach((l, i) => {
    const kk = clamp(crumble * 1.25 - i * 0.04);
    const s = Math.max(0.001, 1 - kk);
    l.scale.setScalar(s);
    l.position.copy(l.userData.home).add(new THREE.Vector3(0, -kk * 0.12, 0));
    l.rotation.set(l.userData.rot.x + kk * 0.6, l.userData.rot.y + kk * 1.2, l.userData.rot.z);
    l.visible = s > 0.01;
  });
  crumbs.forEach(c => {
    const kk = clamp((t - 13.2 - c.userData.delay) / 1.4);
    c.visible = kk > 0 && kk < 1;
    c.position.set(c.userData.x, 0.12 - kk * 0.55, lerp(c.userData.z, Z + 0.05, kk));
    c.rotation.set(kk * c.userData.spin, kk * 3, 0);
    c.scale.setScalar(1 - kk * 0.7);
  });
  // nutrient specks flow from the leaves down into the web
  nutrientSpecks.forEach((m, i) => {
    const h = leafThreads[i % 2];
    const life = span(t, 13.6, 14.2) * (1 - span(t, 16.0, 16.6));
    const u = ((t * 0.32 + i * 0.137) % 1);
    m.position.copy(at(h.curve, 1 - u)); m.position.z += 0.06;
    m.material.opacity = life * Math.sin(u * Math.PI);
    m.visible = life > 0.01;
  });

  // beat 5: trading along root threads — gold sugar to the fungus, teal minerals to the tree
  const trade = span(t, 17.4, 18.0);
  sugarSpecks.forEach((m, i) => {
    const h = rootThreads[i % 4], u = ((t * 0.3 + i * 0.21) % 1);
    m.position.copy(at(h.curve, 1 - u)); m.position.z += 0.06;   // root → web
    m.material.opacity = trade * Math.sin(u * Math.PI); m.visible = trade > 0.01;
  });
  mineralSpecks.forEach((m, i) => {
    const h = rootThreads[(i + 1) % 4], u = ((t * 0.3 + i * 0.17 + 0.5) % 1);
    m.position.copy(at(h.curve, u)); m.position.z += 0.07;       // web → root
    m.material.opacity = trade * Math.sin(u * Math.PI); m.visible = trade > 0.01;
  });

  // camera: high orbit over the island → face-on to the cut, gentle sway → slow settle
  const aspect = camera.aspect, portrait = aspect < 1;
  const fitW = 7.2;                                     // keep the island's width in frame
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * aspect);
  const distFit = (fitW / 2) / Math.tan(hfov / 2);
  const r1 = Math.max(distFit * 1.05, 11), r2 = Math.max(distFit, 10);
  const kc = span(t, 4.4, 7.4), ke = span(t, 16.4, 20);
  const az = lerp(0.75 - t * 0.04, 0.14 * Math.sin(t * 0.22), kc) + ke * 0.06;
  const el = lerp(0.62, 0.17, kc) + ke * 0.04;
  const rad = lerp(r1, r2, kc) * (1 + ke * 0.04);
  camLook.set(0, lerp(0.35, portrait ? -0.95 : -0.8, kc), lerp(-0.6, 0, kc));
  camPos.set(Math.sin(az) * Math.cos(el) * rad, Math.sin(el) * rad, Math.cos(az) * Math.cos(el) * rad).add(camLook);
  camera.position.copy(camPos); camera.lookAt(camLook);

  drawHud(t);
}

/* ---------- render ---------- */
function render(t) {
  update(t);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(hud, hudCam);
}

/* ---------- clock + Ether Explains API ---------- */
let time = 0, playing = false, lastNow = performance.now(), ended = false;
window.ether = {
  duration: DURATION,
  get time() { return time; },
  get playing() { return playing; },
  play() { if (time >= DURATION) time = 0; playing = true; ended = false; lastNow = performance.now(); },
  pause() { playing = false; },
  seek(t) { time = clamp(t, 0, DURATION); ended = time >= DURATION; render(time); },
  restart() { this.seek(0); this.play(); },
  setMuted() {}
};

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 50 : 40;
  camera.updateProjectionMatrix();
  const W2 = renderer.domElement.width, H2 = renderer.domElement.height;
  hc.width = Math.round(W2 * HUD_SCALE); hc.height = Math.round(H2 * HUD_SCALE);
  render(time);
}
addEventListener('resize', resize);
resize();

function loop(now) {
  if (playing) {
    time += Math.min(0.1, (now - lastNow) / 1000);
    if (time >= DURATION) { time = DURATION; playing = false; if (!ended) { ended = true; parent.postMessage({ type: 'ether-end' }, '*'); } }
  }
  lastNow = now;
  render(time);
  requestAnimationFrame(loop);
}
window.ether.play();
parent.postMessage({ type: 'ether-ready', duration: DURATION }, '*');
requestAnimationFrame(loop);
</script>
</body>
